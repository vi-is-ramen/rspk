[package]
name = "rspk-core"
version = "0.1.0"
edition = "2024"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/vi-is-ramen/rspk"
description = "XKCD#1654 solution library"

[dependencies]
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
which = "8.0"

[features]
unstable = []

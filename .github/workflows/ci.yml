name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  unit-tests:
    name: Unit tests
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --all-features --workspace

  integration-tests:
    name: Integration tests
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build pk binary
        run: cargo build --all-features

      - name: "Smoke: pk --version"
        run: ./target/debug/pk --version

      - name: "Smoke: pk --help"
        run: ./target/debug/pk --help

      - name: "Smoke: pk inventory (dry-run)"
        run: ./target/debug/pk --dry-run inventory

      - name: "Smoke: pk install (dry-run)"
        run: ./target/debug/pk --dry-run --quiet install ripgrep

      - name: "Smoke: pk search (dry-run)"
        run: ./target/debug/pk --dry-run search curl

      - name: "Smoke: pk resolve (dry-run)"
        run: ./target/debug/pk --dry-run resolve curl

      - name: "Smoke: pk satisfy (dry-run)"
        run: |
          cat > /tmp/test.Needsfile <<'EOF'
          # integration test needsfile
          ripgrep
          if os = linux {
              curl
          }
          if os = windows {
              winget:git
          }
          if feature "docs" {
              cargo:mdbook
          }
          if mode = "dev" {
              cargo:cargo-watch
          }
          EOF
          ./target/debug/pk --dry-run --quiet satisfy /tmp/test.Needsfile

      - name: "Smoke: pk satisfy with mode & feature (dry-run)"
        run: |
          ./target/debug/pk --dry-run --quiet \
            --mode dev --feature docs \
            satisfy /tmp/test.Needsfile

      - name: "Smoke: pk installed (dry-run)"
        run: ./target/debug/pk --dry-run installed

      - name: "Smoke: pk outdated (dry-run)"
        run: ./target/debug/pk --dry-run outdated

      - name: "Smoke: pk sync (dry-run)"
        run: ./target/debug/pk --dry-run sync

      - name: "Smoke: pk cleanup (dry-run)"
        run: ./target/debug/pk --dry-run cleanup

      - name: "Smoke: pk upgrade (dry-run)"
        run: ./target/debug/pk --dry-run --quiet upgrade --manager apt || true

      - name: "Smoke: pk uninstall (dry-run)"
        run: ./target/debug/pk --dry-run --quiet uninstall curl || true

      - name: "Smoke: pk rpc (JSON-RPC handshake)"
        run: |
          echo '{"jsonrpc":"2.0","method":"system.listMethods","id":1}' \
            | timeout 10 ./target/debug/pk rpc \
            | head -1 \
            | python3 -c "
          import sys, json
          resp = json.loads(sys.stdin.readline())
          assert resp['jsonrpc'] == '2.0', 'bad jsonrpc version'
          assert resp['id'] == 1, 'bad id'
          assert 'methods' in resp['result'], 'no methods in result'
          print('JSON-RPC handshake OK:', resp['result']['methods'])
          "

  regression-tests:
    name: Regression tests
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: regression

      - name: Build pk binary (needed by CLI smoke tests)
        run: cargo build -p rspk-cli

      - name: Run regression tests
        run: >
          cargo test -p rspk-cli
          --features regression
          --test regression
          -- --nocapture

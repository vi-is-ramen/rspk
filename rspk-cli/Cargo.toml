[package]
name = "rspk-cli"
version = "0.1.0"
edition = "2024"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/vi-is-ramen/rspk"

[[bin]]
name = "pk"
path = "src/main.rs"

[dependencies]
rspk-core = { path = "../librspk", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
assert_fs = "1.0"
predicates = "3.0"

[features]
unstable = ["rspk-core/unstable"]
